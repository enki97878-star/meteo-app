<!DOCTYPE html>
<html>
<head>
    <title>Stacja pogodowa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
            display: inline-block;
        }
        canvas {
            max-width: 800px;
            margin-top: 20px;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
            color: black;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ccc;
        }
        th {
            background: #1e293b;
            color: white;
        }
    </style>
</head>
<body>

<h1>🌤️ Stacja pogodowa</h1>

<div class="card">
    <h2>Ostatni pomiar</h2>
    <p id="stacja"></p>
    <p id="czas"></p>
    <p id="temp"></p>
    <p id="wiatr"></p>
</div>

<canvas id="wykres"></canvas>

<h2>📊 Archiwum pomiarów</h2>

<table>
    <tr>
        <th>Data</th>
        <th>Godzina</th>
        <th>Temperatura (°C)</th>
        <th>Wiatr (m/s)</th>
    </tr>

    {% for row in dane %}
    <tr>
        <td>{{ row.data }}</td>
        <td>{{ row.godzina }}</td>
        <td>{{ row.temperatura }}</td>
        <td>{{ row.wiatr }}</td>
    </tr>
    {% endfor %}
</table>

<script>
    const dane = {{ dane.to_dict(orient='records') | tojson }};

    if (dane.length > 0) {

        const last = dane[0]; // najnowszy rekord (bo sort DESC)

        document.getElementById("czas").innerText =
            "Data i godzina: " + last.czas;

        document.getElementById("stacja").innerText =
            "Stacja: " + last.stacja;

        document.getElementById("temp").innerText =
            "Temperatura: " + last.temperatura + " °C";

        document.getElementById("wiatr").innerText =
            "Wiatr: " + last.wiatr + " m/s";

        const labels = dane.map(d => d.czas);
        const temp = dane.map(d => d.temperatura);
        const wiatr = dane.map(d => d.wiatr);

        new Chart(document.getElementById("wykres"), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: temp,
                        borderColor: 'red'
                    },
                    {
                        label: 'Wiatr (m/s)',
                        data: wiatr,
                        borderColor: 'cyan'
                    }
                ]
            }
        });
    }
</script>

</body>
</html>
